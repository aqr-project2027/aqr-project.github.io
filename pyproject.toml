[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqr-relation-query"
version = "0.2.0"
description = "Self-contained AQR relation-query training and evaluation tools."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["contactflow*", "diffusion_policy_3d*"]
